on:
  push:
    branches-ignore: [main, gh-pages]
    paths:
      - "_pipeline/first-map/data/seed/documents.csv"
      - "_pipeline/first-map/tools/fetch_documents.py"
      - ".github/workflows/fetch-documents.yml"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Fetch every document again"
        type: boolean
        default: false

name: Fetch primary documents

concurrency:
  group: fetch-documents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _pipeline/first-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests pdfplumber
      - run: python -u tools/fetch_documents.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit the text copies
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add _pipeline/first-map/data/documents
          git commit -m "Save text copies of primary documents" || echo "nothing changed"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
